name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read the repo, publish to Pages, and mint the OIDC token
# deploy-pages exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a push that lands
# mid-deploy still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    # Pull requests get built and typechecked, but never published.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
